  <text x='255.39999999999998' y='392' font-family='Inter, Roboto, Arial, sans-serif' font-size='13' font-weight='normal' fill='#ffffff' text-anchor='start'>On my way</text>
  <text x='326' y='422' font-family='Inter, Roboto, Arial, sans-serif' font-size='10' font-weight='normal' fill='#d64545' text-anchor='end'>Failed · tap to retry</text>
